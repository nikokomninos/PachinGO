services:
  api:
    build:
      context: ./backend
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/healthz').then(r => process.exit(r.status === 204 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
